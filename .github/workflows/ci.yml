name: CI

on: [push, pull_request]

# Read-only token, set here rather than relying on the repository default (ADR 0023).
permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to malicious code, a
# commit SHA cannot. Dependabot (.github/dependabot.yml) proposes updates to the pins.

jobs:
  check:
    runs-on: ubuntu-latest

    # A "service container" is a Docker container GitHub starts next to the job and tears
    # down afterwards. It is the CI twin of the `db` service in docker-compose.yml: same
    # image, same credentials, same host port, so tests see the same database as locally.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag-dev-only
          POSTGRES_DB: rag
        ports:
          - 5433:5432 # host:container, like compose
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Test fixtures create the rag_test database themselves on this server.
      TEST_DATABASE_URL: postgresql://rag:rag-dev-only@localhost:5433/rag_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the job's token in .git/config for later steps to find.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts evals
      - run: uv run pytest
