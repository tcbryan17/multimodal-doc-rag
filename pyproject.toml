[project]
name = "multimodal-doc-rag"
version = "0.1.0"
description = "RAG over text- and image-heavy documents with page-level citations"
authors = [
    { name = "tcbryan17", email = "tcbryan17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
