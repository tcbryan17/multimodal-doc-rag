[project]
name = "multimodal-doc-rag"
version = "0.1.0"
description = "RAG over text- and image-heavy documents with page-level citations"
authors = [
    { name = "tcbryan17", email = "tcbryan17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "httpx2>=2.16.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests (real OpenRouter calls, cost money) are off by default; run them with `-m live`.
addopts = "--strict-markers -m 'not live'"
# Turn deprecation warnings into errors so they stay at zero.
filterwarnings = [
    "error::DeprecationWarning",
    # PyMuPDF's SWIG bindings warn at import ("builtin type SwigPy... has no __module__").
    # Third-party and harmless; later entries win, so this exempts only those messages.
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
markers = [
    "db: needs a reachable Postgres (skipped when unreachable)",
    "live: makes real OpenRouter calls (skipped unless selected with -m live)",
]

[tool.mypy]
python_version = "3.12"
strict = true

# PyMuPDF ships partial type hints: many of its methods are unannotated, which strict mode
# rejects ("call to untyped function"). Treat the whole package as Any instead of
# sprinkling ignores; our own code around it stays fully typed.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true
